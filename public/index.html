<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>League History</title>
    <meta name="description" content="Full history of a CBS fantasy football league: standings, champions, head-to-head records and every draft pick." />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🏈</text></svg>" />
  </head>
  <body>
    <header>
      <div class="head-inner">
        <div>
          <h1 id="league-name">League History</h1>
          <p class="subtitle" id="league-range">Loading…</p>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button">Theme</button>
      </div>
      <nav id="tabs" role="tablist">
        <button role="tab" data-view="overview" aria-selected="true">Overview</button>
        <button role="tab" data-view="seasons" aria-selected="false">Seasons</button>
        <button role="tab" data-view="franchises" aria-selected="false">Franchises</button>
        <button role="tab" data-view="h2h" aria-selected="false">Head-to-head</button>
        <button role="tab" data-view="drafts" aria-selected="false">Drafts</button>
        <button role="tab" data-view="records" aria-selected="false">Records</button>
      </nav>
    </header>

    <main class="wrap" id="main">
      <div class="panel"><p class="empty">Loading league data…</p></div>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
